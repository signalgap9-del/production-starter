# Bank-style promotion pipeline (stack-agnostic skeleton).
# Build ONCE, sign provenance, promote the SAME artifact staging → production.
# Separation of duties: production is a GitHub Environment with required
# reviewers (Settings → Environments → production → Required reviewers,
# "Prevent self-review" on). The approver cannot be the author.
#
# Replace the three `TODO` steps with the real deploy/smoke/rollback commands
# (wrangler-action, aws, kubectl/argo, vercel ...).
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - id: meta
        run: echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Package artifact
        run: tar -czf "app-${{ steps.meta.outputs.version }}.tgz" --exclude=node_modules --exclude=.git .
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app-${{ steps.meta.outputs.version }}.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: app-${{ steps.meta.outputs.version }}.tgz
          retention-days: 90

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
      - name: Deploy to staging
        run: echo "TODO deploy app-${{ needs.build.outputs.version }}.tgz to staging" && exit 1
      - name: Smoke test staging
        run: echo "TODO run E2E smoke against staging URL" && exit 1

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production # required reviewers gate this job
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
      - name: Gradual rollout (canary → 100%)
        run: echo "TODO deploy app-${{ needs.build.outputs.version }}.tgz as canary, watch error rate, then promote" && exit 1
      - name: Post-deploy smoke
        id: smoke
        run: echo "TODO run smoke against production" && exit 1
      - name: Automatic rollback on failed smoke
        if: failure()
        run: echo "TODO roll back to previous release" && exit 1
