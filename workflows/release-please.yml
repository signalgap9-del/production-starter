# googleapis/release-please-action: reads Conventional Commits on main, keeps a
# release PR open with the next version + CHANGELOG. Merging it tags a release.
# Hook deploy-to-production onto `release_created` once a deploy target exists.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
